stages:
  - compliance

variables:
  NOD_TARGET: 'examples/spec_compliant.md'
  NOD_RULES: 'defaults/'

nod_validation:
  stage: compliance
  image: python:3.10-slim
  before_script:
    - pip install nod-linter
  script:
    # Step 1: Generate SARIF (soft fail)
    - nod $NOD_TARGET --rules $NOD_RULES --strict --min-severity HIGH --output sarif --save-to nod-results.sarif || true
    
    # Step 2: Generate JSON (soft fail)
    - nod $NOD_TARGET --rules $NOD_RULES --strict --min-severity HIGH --output json --save-to nod-attestation.json || true
    
    # Step 3: Print JSON to logs
    - echo "===== Full JSON Attestation ====="
    - cat nod-attestation.json || echo "JSON file not found"
    - echo "================================="
    
    # Step 4: Final gatekeeper (hard fail)
    - nod $NOD_TARGET --rules $NOD_RULES --strict --min-severity HIGH
    
  artifacts:
    when: always
    expire_in: 5 days
    paths:
      - nod-results.sarif
      - nod-attestation.json
    reports:
      sast: nod-results.sarif
      
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual  # For workflow_dispatch equivalent
